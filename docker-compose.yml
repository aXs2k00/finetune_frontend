version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: metasploit
    ports:
      - "55553:55553"
      - "55555:55555"
    environment:
      - METASPLOIT_DB_PASSWORD=metasploit
      - METASPLOIT_DB_USER=msf
      - METASPLOIT_DB_NAME=msf
    volumes:
      - msf-data:/root/.msf4
    command: msfrpc -a 0.0.0.0 -p 55553 -t json -U msf -P metasploit
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "55553"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - METASPLOIT_HOST=metasploit
      - METASPLOIT_PORT=55553
      - METASPLOIT_PASSWORD=metasploit
      - DATABASE_URL=sqlite:///./ollama_manager.db
    volumes:
      - ./backend:/app
    depends_on:
      - ollama
      - metasploit
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  ollama-data:
  msf-data: